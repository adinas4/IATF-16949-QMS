name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_FIREBASE_API_KEY: 'AIzaSyAf8cPmc1buQo2B_EtbiUOIy9EvI9YcLpk'
          VITE_FIREBASE_AUTH_DOMAIN: 'iatf-16949-qms.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'iatf-16949-qms'
          VITE_FIREBASE_STORAGE_BUCKET: 'iatf-16949-qms.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '782293771080'
          VITE_FIREBASE_APP_ID: '1:782293771080:web:068f3a1bfd47cd6745897d'

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GitHub Pages static build"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
