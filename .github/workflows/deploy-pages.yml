name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test supplier audit scoring
        run: node --test tests/supplier-audit.test.mjs

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_FIREBASE_API_KEY: 'AIzaSyAf8cPmc1buQo2B_EtbiUOIy9EvI9YcLpk'
          VITE_FIREBASE_AUTH_DOMAIN: 'iatf-16949-qms.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'iatf-16949-qms'
          VITE_FIREBASE_STORAGE_BUCKET: 'iatf-16949-qms.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '782293771080'
          VITE_FIREBASE_APP_ID: '1:782293771080:web:068f3a1bfd47cd6745897d'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
